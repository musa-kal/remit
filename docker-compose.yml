# Remit local stack. Copy .env.example to .env first, then: docker compose up -d
# Optional tools (Kafka UI): docker compose --profile tools up -d

name: remit

services:
  # --- Infrastructure ---------------------------------------------------------

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      TZ: UTC
      # Read by docker/mysql/init-users.sh on first start.
      REMIT_INTAKE_DB_PASSWORD: ${REMIT_INTAKE_DB_PASSWORD:?set REMIT_INTAKE_DB_PASSWORD in .env}
      REMIT_ROUTING_DB_PASSWORD: ${REMIT_ROUTING_DB_PASSWORD:?set REMIT_ROUTING_DB_PASSWORD in .env}
      REMIT_API_DB_PASSWORD: ${REMIT_API_DB_PASSWORD:?set REMIT_API_DB_PASSWORD in .env}
    ports:
      - "${REMIT_MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./docker/mysql/init-users.sh:/docker-entrypoint-initdb.d/02-init-users.sh:ro
    networks:
      - remit
    healthcheck:
      # TCP on 127.0.0.1 only answers once the init scripts are done, because the
      # temporary bootstrap server the image starts during init has networking disabled.
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  mongo:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
      # Read by docker/mongo/init.js on first start.
      REMIT_MONGO_USER: ${REMIT_MONGO_USER:-remit_audit}
      REMIT_MONGO_PASSWORD: ${REMIT_MONGO_PASSWORD:?set REMIT_MONGO_PASSWORD in .env}
    ports:
      - "${REMIT_MONGO_PORT:-27018}:27017"
    volumes:
      - mongo-data:/data/db
      - ./docker/mongo/init.js:/docker-entrypoint-initdb.d/01-init.js:ro
    networks:
      - remit
    healthcheck:
      # Connects via the container hostname, not localhost: the temporary server the image
      # runs during init listens on 127.0.0.1 only, so this passes only once the real server is up.
      # It also requires the four audit_events indexes (_id plus three) that init.js creates.
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host "$$(hostname)"
          -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin
          --eval 'quit(db.getSiblingDB("remit_audit").audit_events.getIndexes().length === 4 ? 0 : 1)'
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  kafka:
    image: apache/kafka:3.9.2
    hostname: kafka
    environment:
      # Single-node KRaft: this node is both broker and controller, no ZooKeeper.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # PLAINTEXT serves containers on the compose network (kafka:9092);
      # PLAINTEXT_HOST serves processes on the host machine (localhost:29092).
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Topics are created explicitly (kafka-init and NewTopic beans), never implicitly.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - remit
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 20
      start_period: 20s

  # One-shot job: creates all topics with 3 partitions, then exits 0.
  # App services should depend on it with condition: service_completed_successfully.
  kafka-init:
    image: apache/kafka:3.9.2
    entrypoint: ["bash", "/opt/remit/create-topics.sh"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      TOPIC_PARTITIONS: 3
      TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - ./docker/kafka/create-topics.sh:/opt/remit/create-topics.sh:ro
    networks:
      - remit
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  # SFTP drop zone. Clients upload to /inbound; intake-service moves files through
  # /processing to /processed or /error. Password auth, chrooted to the user's home.
  sftp:
    image: atmoz/sftp:alpine
    environment:
      # Format user:password:uid:gid:dirs (dirs are created inside the chrooted home).
      SFTP_USERS: "${REMIT_SFTP_USER:-remit}:${REMIT_SFTP_PASSWORD:?set REMIT_SFTP_PASSWORD in .env}:1001:1001:inbound,processing,processed,error"
      REMIT_SFTP_USER: ${REMIT_SFTP_USER:-remit}
    ports:
      - "${REMIT_SFTP_PORT:-2222}:22"
    volumes:
      - sftp-data:/home/${REMIT_SFTP_USER:-remit}
    networks:
      - remit
    healthcheck:
      # Healthy once the user's directories exist and sshd is listening on port 22 (0x0016).
      # Reads /proc/net/tcp instead of opening a connection, which would log a preauth disconnect.
      test: ["CMD-SHELL", "test -d \"/home/$${REMIT_SFTP_USER}/error\" && grep -qE ':0016 [0-9A-F]{8}:0000 0A' /proc/net/tcp"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # --- Application services (added in M5) ---------------------------------------
  # intake-service: depends on mysql, kafka-init (completed) and sftp.
  # routing-service: depends on mysql and kafka-init (completed).
  # api-service: depends on mysql, mongo and kafka-init (completed).

networks:
  remit:
    name: remit

volumes:
  mysql-data:
  mongo-data:
  kafka-data:
  sftp-data:
