# Remit local stack. Copy .env.example to .env first, then: docker compose up -d
# Optional tools (Kafka UI): docker compose --profile tools up -d

name: remit

services:
  # --- Infrastructure ---------------------------------------------------------

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      TZ: UTC
      # Read by docker/mysql/init-users.sh on first start.
      REMIT_INTAKE_DB_PASSWORD: ${REMIT_INTAKE_DB_PASSWORD:?set REMIT_INTAKE_DB_PASSWORD in .env}
      REMIT_ROUTING_DB_PASSWORD: ${REMIT_ROUTING_DB_PASSWORD:?set REMIT_ROUTING_DB_PASSWORD in .env}
      REMIT_API_DB_PASSWORD: ${REMIT_API_DB_PASSWORD:?set REMIT_API_DB_PASSWORD in .env}
    ports:
      - "${REMIT_MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./docker/mysql/init-users.sh:/docker-entrypoint-initdb.d/02-init-users.sh:ro
    networks:
      - remit
    healthcheck:
      # TCP on 127.0.0.1 only answers once the init scripts are done, because the
      # temporary bootstrap server the image starts during init has networking disabled.
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  mongo:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
    ports:
      - "${REMIT_MONGO_PORT:-27018}:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - remit
    healthcheck:
      # Connects via the container hostname, not localhost: the temporary server the image
      # runs during init listens on 127.0.0.1 only, so this passes only once the real server is up.
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host "$$(hostname)"
          -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin
          --eval 'quit(db.adminCommand({ ping: 1 }).ok === 1 ? 0 : 1)'
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  # --- Application services (added in M5) ---------------------------------------
  # intake-service: depends on mysql, kafka-init (completed) and sftp.
  # routing-service: depends on mysql and kafka-init (completed).
  # api-service: depends on mysql, mongo and kafka-init (completed).

networks:
  remit:
    name: remit

volumes:
  mysql-data:
  mongo-data:
  kafka-data:
