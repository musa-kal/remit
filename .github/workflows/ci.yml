# GitHub Actions mirror of the Jenkins stages "Static checks" and "Build and test", for a visible
# badge. The full pipeline (SonarQube, images, E2E, Newman) runs on the local Jenkins: ci/README.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  checks: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Static checks (Spotless)
        run: ./mvnw -B spotless:check

      # The runner image ships an older ShellCheck; use the version the Jenkins image pins.
      - name: Install ShellCheck 0.11.0
        run: |
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            | tar -xJ -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/shellcheck-v0.11.0" >> "${GITHUB_PATH}"

      - name: Static checks (ShellCheck)
        run: shellcheck --version && shellcheck scripts/*.sh ci/*.sh

      # The runner image ships kubectl; rendering catches broken kustomizations and patches.
      - name: Static checks (Kubernetes manifests render)
        run: |
          kubectl kustomize k8s/base >/dev/null
          kubectl kustomize --load-restrictor LoadRestrictionsNone k8s/overlays/local >/dev/null

      # Testcontainers uses the runner's Docker daemon.
      - name: Build and test
        run: ./mvnw -B verify

      - name: Publish test results
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: "**/target/surefire-reports/TEST-*.xml,**/target/failsafe-reports/TEST-*.xml"
          check_name: JUnit results

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
            **/target/site/jacoco/
          if-no-files-found: ignore
