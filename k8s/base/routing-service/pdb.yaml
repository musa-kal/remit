# Keeps at least one routing-service consumer running during voluntary disruptions (node drains).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: routing-service
  labels:
    app.kubernetes.io/name: routing-service
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: routing-service
