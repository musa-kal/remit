# Namespace for the whole Remit stack. The application pods meet the "restricted" Pod Security
# Standard; the namespace enforces "baseline" because the local overlay's SFTP server (atmoz/sftp)
# has to start as root to set up its chroot, and warns about anything that is not "restricted".
apiVersion: v1
kind: Namespace
metadata:
  name: remit
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
