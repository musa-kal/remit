# api-service: operator REST API, read model and audit writer (spec section 7).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
  labels:
    app.kubernetes.io/name: api-service
    app.kubernetes.io/component: api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: api-service
  template:
    metadata:
      annotations:
        # kubectl logs and exec pick the service, not the init container.
        kubectl.kubernetes.io/default-container: api-service
      labels:
        app.kubernetes.io/name: api-service
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      # Service links would add variables such as KAFKA_PORT=tcp://... to the environment.
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Waits until MySQL, MongoDB and Kafka accept connections (see intake-service).
        - name: wait-for-dependencies
          image: remit/api-service:latest
          imagePullPolicy: IfNotPresent
          command:
            - bash
            - -c
            - |
              for dep in mysql:3306 mongo:27017 kafka:9092; do
                until timeout 2 bash -c "exec 3<>/dev/tcp/${dep%:*}/${dep#*:}" 2>/dev/null; do
                  echo "waiting for ${dep}"
                  sleep 2
                done
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: api-service
          image: remit/api-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: remit-config
          env:
            - name: REMIT_API_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: remit-secrets
                  key: REMIT_API_DB_PASSWORD
            - name: REMIT_MONGO_USER
              valueFrom:
                secretKeyRef:
                  name: remit-secrets
                  key: REMIT_MONGO_USER
            - name: REMIT_MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: remit-secrets
                  key: REMIT_MONGO_PASSWORD
            - name: REMIT_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: remit-secrets
                  key: REMIT_JWT_SECRET
            - name: REMIT_OPERATOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: remit-secrets
                  key: REMIT_OPERATOR_PASSWORD
            - name: REMIT_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: remit-secrets
                  key: REMIT_ADMIN_PASSWORD
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          # Liveness and readiness only begin once the startup probe has passed (up to 200 s).
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
