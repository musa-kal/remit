# Documents every key of the remit-secrets Secret. It is NOT part of the kustomization and holds
# placeholders only: the real Secret is built from .env by scripts/k8s-secrets.sh, e.g.
#   scripts/k8s-secrets.sh            # create or update remit-secrets in namespace remit
# Never commit real values. The same key names are used in .env (see .env.example).
apiVersion: v1
kind: Secret
metadata:
  name: remit-secrets
  namespace: remit
type: Opaque
stringData:
  # MySQL (local overlay): root password, read by the mysql pod and its init script.
  MYSQL_ROOT_PASSWORD: change-me-mysql-root
  # Passwords of the per-service MySQL users remit_intake, remit_routing and remit_api.
  REMIT_INTAKE_DB_PASSWORD: change-me-intake-db
  REMIT_ROUTING_DB_PASSWORD: change-me-routing-db
  REMIT_API_DB_PASSWORD: change-me-api-db
  # MongoDB (local overlay): root user of the mongo pod.
  MONGO_ROOT_USERNAME: root
  MONGO_ROOT_PASSWORD: change-me-mongo-root
  # Append-only audit user of remit_audit (api-service). URL-safe characters only.
  REMIT_MONGO_USER: remit_audit
  REMIT_MONGO_PASSWORD: change-me-mongo-audit
  # SFTP drop zone login (intake-service and the local overlay's sftp pod).
  REMIT_SFTP_USER: remit
  REMIT_SFTP_PASSWORD: change-me-sftp
  # api-service: HS256 signing key, at least 32 bytes (openssl rand -base64 48).
  REMIT_JWT_SECRET: change-me-to-a-random-secret-of-at-least-32-bytes
  # api-service: passwords of the seeded operator and admin users.
  REMIT_OPERATOR_PASSWORD: change-me-operator
  REMIT_ADMIN_PASSWORD: change-me-admin
