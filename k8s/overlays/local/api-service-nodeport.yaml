# Exposes the operator API on node port 30080. k8s/kind-config.yaml maps that port to
# localhost:8080 on the host, so the API answers at http://localhost:8080 like in docker compose.
# Alternative without the port mapping: kubectl -n remit port-forward svc/api-service 8080:8080
apiVersion: v1
kind: Service
metadata:
  name: api-service
spec:
  type: NodePort
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
