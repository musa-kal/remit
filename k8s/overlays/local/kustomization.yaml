# Local overlay for a kind cluster (scripts/k8s-up.sh): the base services plus MySQL, MongoDB,
# Kafka and SFTP from infra/, demo settings, and the API on a NodePort.
#
# Render or apply it with the load restrictor off, because infra/ turns the docker/ init scripts
# into ConfigMaps:
#   kubectl kustomize --load-restrictor LoadRestrictionsNone k8s/overlays/local | kubectl apply -f -
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: remit
resources:
  - ../../base
  - infra
patches:
  - path: config-local.yaml
  - path: api-service-nodeport.yaml
