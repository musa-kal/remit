# kind cluster for the local overlay (scripts/k8s-up.sh creates it: kind create cluster --config
# k8s/kind-config.yaml). One node is enough; node port 30080 (api-service) is published on the
# host as localhost:8080, the same address docker compose uses, so stop compose first.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: remit
nodes:
  - role: control-plane
    # The default node image of kind v0.33.0, pinned by digest (the version this was verified on).
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        listenAddress: "127.0.0.1"
        protocol: TCP
